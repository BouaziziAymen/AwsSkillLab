<div
  class="flex h-screen w-full gap-4 p-4 bg-slate-900/90 font-mono overflow-hidden"
>
  <!-- Left Side: Canvas Component -->
  <div
    class="w-1/3 bg-slate-950/40 border border-slate-800 rounded-xl p-3 flex flex-col overflow-hidden shadow-2xl"
  >
    <app-architecture-canvas
      class="flex-1 w-full h-full"
    ></app-architecture-canvas>
  </div>

  <!-- Right Side: Console Component (Top) + Task Display Component (Bottom) -->
  <div class="w-2/3 flex flex-col gap-4 flex-1 min-h-0">
    <!-- Top Right: Console Component -->
    <div
      class="flex-1 min-h-0 bg-slate-950/60 border border-slate-800 rounded-xl overflow-hidden shadow-xl flex flex-col"
    >
      <app-console class="flex-1 w-full h-full"></app-console>
    </div>

    <!-- Bottom Right: Task Display Component -->
    <div class="flex-1 min-h-0 flex flex-col">
      <app-task-display
        class="h-full w-full flex flex-col"
        [currentTaskTitle]="taskTitle"
        [currentTaskDescription]="taskDescription"
      >
      </app-task-display>
    </div>
  </div>
</div>
