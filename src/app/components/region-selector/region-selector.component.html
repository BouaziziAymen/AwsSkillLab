<div class="relative">
  <button
    type="button"
    (click)="isRegionDropdownOpen = !isRegionDropdownOpen"
    class="bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-[11px] text-slate-200 flex items-center gap-2 focus:outline-none focus:border-cyan-400"
  >
    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
    <span>{{ selectedRegion }}</span>
    <svg
      class="w-3 h-3 text-slate-400 transition-transform"
      [class.rotate-180]="isRegionDropdownOpen"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M19 9l-7 7-7-7"
      />
    </svg>
  </button>

  @if (isRegionDropdownOpen) {
    <div
      class="absolute right-0 mt-1 w-48 bg-slate-950 border border-slate-700 rounded-lg shadow-xl z-50 overflow-hidden p-1 space-y-0.5"
    >
      <div
        (click)="selectRegion('US East (N. Virginia)')"
        class="px-2.5 py-1.5 rounded text-[11px] text-slate-300 hover:bg-cyan-950/50 hover:text-cyan-300 cursor-pointer transition"
      >
        US East (N. Virginia)
      </div>
      <div
        (click)="selectRegion('US West (Oregon)')"
        class="px-2.5 py-1.5 rounded text-[11px] text-slate-300 hover:bg-cyan-950/50 hover:text-cyan-300 cursor-pointer transition"
      >
        US West (Oregon)
      </div>
      <div
        (click)="selectRegion('Europe (Frankfurt)')"
        class="px-2.5 py-1.5 rounded text-[11px] text-slate-300 hover:bg-cyan-950/50 hover:text-cyan-300 cursor-pointer transition"
      >
        Europe (Frankfurt)
      </div>
      <div
        (click)="selectRegion('Asia Pacific (Tokyo)')"
        class="px-2.5 py-1.5 rounded text-[11px] text-slate-300 hover:bg-cyan-950/50 hover:text-cyan-300 cursor-pointer transition"
      >
        Asia Pacific (Tokyo)
      </div>
    </div>
  }
</div>
