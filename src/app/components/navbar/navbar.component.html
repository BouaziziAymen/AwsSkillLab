<div
  class="flex items-center justify-between border-b border-slate-800 pb-4 mb-4 gap-4"
>
  <app-service-selector
    [selectedService]="selectedService"
    (serviceChange)="serviceChange.emit($event)"
  >
  </app-service-selector>

  <app-region-selector
    [selectedRegion]="selectedRegion"
    (regionChange)="regionChange.emit($event)"
  >
  </app-region-selector>
</div>
