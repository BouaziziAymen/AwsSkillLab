<div
  class="bg-slate-950/80 border border-slate-800 rounded-lg p-4 flex flex-col justify-between text-xs text-slate-300 shadow-xl h-full"
>
  <div class="space-y-2">
    <div
      class="flex items-center justify-between border-b border-slate-800 pb-2"
    >
      <span class="text-cyan-400 font-bold uppercase tracking-wider text-[10px]"
        >Active Challenge / Task</span
      >
      <span
        class="px-2 py-0.5 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded text-[10px] font-semibold"
        >In Progress</span
      >
    </div>
    <div class="font-semibold text-slate-200 text-sm">
      {{ currentTaskTitle }}
    </div>
    <p class="text-slate-400 leading-relaxed text-xs">
      {{ currentTaskDescription }}
    </p>
  </div>

  <div
    class="pt-3 border-t border-slate-800/60 flex items-center justify-between"
  >
    <span class="text-[10px] text-slate-500">Target: AWS VPC Security</span>
    <button
      type="button"
      class="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded text-xs font-semibold transition shadow-[0_0_10px_rgba(6,182,212,0.3)]"
    >
      Submit Task
    </button>
  </div>
</div>
