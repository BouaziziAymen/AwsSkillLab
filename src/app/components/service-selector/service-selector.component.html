<div class="relative w-72">
  <button
    type="button"
    (click)="isDropdownOpen = !isDropdownOpen"
    class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-100 flex items-center justify-between focus:outline-none focus:border-cyan-400"
  >
    <span class="flex items-center gap-2 truncate">
      @if (selectedService === "RDS") {
        <svg
          class="w-4 h-4 text-blue-400 shrink-0"
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <path
            d="M12 2C6.48 2 2 4.02 2 6.5v11C2 19.98 6.48 22 12 22s10-2.02 10-4.5v-11C22 4.02 17.52 2 12 2zm0 2c4.41 0 8 1.34 8 3s-3.59 3-8 3-8-1.34-8-3 3.59-3 8-3zm0 16c-4.41 0-8-1.34-8-3v-2.15c1.45 1.04 4.3 1.65 8 1.65s6.55-.61 8-1.65V17c0 1.66-3.59 3-8 3zm0-6c-4.41 0-8-1.34-8-3V8.85c1.45 1.04 4.3 1.65 8 1.65s6.55-.61 8-1.65V11c0 1.66-3.59 3-8 3z"
          />
        </svg>
        <span class="truncate">RDS - Database</span>
      } @else if (selectedService === "S3") {
        <svg
          class="w-4 h-4 text-emerald-400 shrink-0"
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <path
            d="M21 16.5c0 .38-.21.71-.53.88l-7.9 4.44c-.16.09-.36.14-.57.14s-.41-.05-.57-.14l-7.9-4.44A1.002 1.002 0 013 16.5v-9c0-.38.21-.71.53-.88l7.9-4.44c.16-.09.36-.14.57-.14s.41.05.57.14l7.9 4.44c.32.17.53.5.53.88v9z"
          />
        </svg>
        <span class="truncate">S3 - Storage</span>
      } @else if (selectedService === "LAMBDA") {
        <svg
          class="w-4 h-4 text-amber-400 shrink-0"
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
        </svg>
        <span class="truncate">LAMBDA - Compute</span>
      } @else {
        <svg
          class="w-4 h-4 text-cyan-400 shrink-0"
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <path
            d="M12 2a10 10 0 1010 10A10 10 0 0012 2zm0 18a8 8 0 118-8 8 8 0 01-8 8z"
          />
        </svg>
        <span class="truncate">VPC - Networking</span>
      }
    </span>
    <svg
      class="w-3.5 h-3.5 text-slate-400 transition-transform shrink-0"
      [class.rotate-180]="isDropdownOpen"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M19 9l-7 7-7-7"
      />
    </svg>
  </button>

  @if (isDropdownOpen) {
    <div
      class="absolute left-0 mt-1 w-72 bg-slate-950 border border-slate-700 rounded-lg shadow-xl z-50 overflow-hidden space-y-0.5 p-1"
    >
      <div
        (click)="selectService('RDS')"
        class="flex items-center gap-2.5 px-3 py-2 rounded text-xs text-slate-200 hover:bg-cyan-950/50 hover:text-cyan-300 cursor-pointer transition"
      >
        <span>RDS (Relational Database Service)</span>
      </div>
      <div
        (click)="selectService('S3')"
        class="flex items-center gap-2.5 px-3 py-2 rounded text-xs text-slate-200 hover:bg-cyan-950/50 hover:text-cyan-300 cursor-pointer transition"
      >
        <span>S3 (Simple Storage Service)</span>
      </div>
      <div
        (click)="selectService('LAMBDA')"
        class="flex items-center gap-2.5 px-3 py-2 rounded text-xs text-slate-200 hover:bg-cyan-950/50 hover:text-cyan-300 cursor-pointer transition"
      >
        <span>LAMBDA (Serverless)</span>
      </div>
      <div
        (click)="selectService('VPC')"
        class="flex items-center gap-2.5 px-3 py-2 rounded text-xs text-slate-200 hover:bg-cyan-950/50 hover:text-cyan-300 cursor-pointer transition"
      >
        <span>VPC (Virtual Private Cloud)</span>
      </div>
    </div>
  }
</div>
