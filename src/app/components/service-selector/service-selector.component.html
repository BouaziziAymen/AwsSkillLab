<div class="relative w-72 font-mono">
  <!-- Dropdown Trigger Button -->
  <button
    type="button"
    (click)="isDropdownOpen = !isDropdownOpen"
    class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-100 flex items-center justify-between focus:outline-none focus:border-cyan-400"
  >
    <span class="flex items-center gap-2 truncate">
      <!-- Icon Renderer -->
      <img
        [src]="getCurrentServiceObj().iconPath"
        class="w-4 h-4 shrink-0 object-contain"
        alt=""
        (error)="$any($event.target).style.display = 'none'"
      />
      <span class="truncate">{{ getCurrentServiceObj().name }}</span>
    </span>
    <svg
      class="w-3.5 h-3.5 text-slate-400 transition-transform shrink-0"
      [class.rotate-180]="isDropdownOpen"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M19 9l-7 7-7-7"
      />
    </svg>
  </button>

  <!-- Dropdown Menu -->
  @if (isDropdownOpen) {
    <div
      class="absolute left-0 mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg shadow-xl z-50 overflow-hidden p-1 space-y-1"
    >
      <!-- Search Box -->
      <div class="p-1">
        <input
          type="text"
          [(ngModel)]="searchQuery"
          placeholder="Search services..."
          class="w-full bg-slate-900 border border-slate-800 rounded px-2.5 py-1 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-400"
          (click)="$event.stopPropagation()"
        />
      </div>

      <!-- Service Options List -->
      <div class="max-h-48 overflow-y-auto space-y-0.5">
        @for (service of filteredServices; track service.id) {
          <div
            (click)="selectService(service)"
            class="flex items-center gap-2.5 px-3 py-2 rounded text-xs text-slate-200 hover:bg-cyan-950/50 hover:text-cyan-300 cursor-pointer transition"
          >
            <img
              [src]="service.iconPath"
              class="w-4 h-4 shrink-0 object-contain"
              alt=""
              (error)="$any($event.target).style.display = 'none'"
            />
            <span class="truncate">{{ service.name }}</span>
          </div>
        } @empty {
          <div class="px-3 py-2 text-xs text-slate-500 text-center">
            No services found
          </div>
        }
      </div>
    </div>
  }
</div>
