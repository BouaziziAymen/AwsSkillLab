<div class="relative inline-block text-left">
  <!-- AWS Console Style Actions Button -->
  <button
    (click)="isOpen.set(!isOpen())"
    [disabled]="disabled()"
    class="flex items-center gap-2 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed border border-slate-600 rounded text-xs font-medium text-slate-200 transition-colors shadow-sm"
  >
    <span>Actions</span>
    <svg
      class="w-3.5 h-3.5 text-slate-400"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M19 9l-7 7-7-7"
      />
    </svg>
  </button>

  <!-- Dropdown Menu -->
  @if (isOpen()) {
    <div
      class="absolute left-0 mt-1 w-56 origin-top-left rounded bg-slate-900 border border-slate-700 shadow-xl z-50 py-1 text-xs text-slate-300"
    >
      <div
        class="px-3 py-1.5 text-[10px] font-semibold text-slate-500 uppercase tracking-wider border-b border-slate-800"
      >
        Instance state
      </div>
      <button
        (click)="selectAction('start')"
        class="w-full text-left px-3 py-2 hover:bg-cyan-950/40 hover:text-cyan-300 flex items-center justify-between"
      >
        <span>Start instance</span>
      </button>
      <button
        (click)="selectAction('stop')"
        class="w-full text-left px-3 py-2 hover:bg-cyan-950/40 hover:text-cyan-300 flex items-center justify-between"
      >
        <span>Stop instance</span>
      </button>
      <button
        (click)="selectAction('reboot')"
        class="w-full text-left px-3 py-2 hover:bg-cyan-950/40 hover:text-cyan-300 flex items-center justify-between"
      >
        <span>Reboot instance</span>
      </button>
      <div class="border-t border-slate-800 my-1"></div>
      <button
        (click)="selectAction('terminate')"
        class="w-full text-left px-3 py-2 hover:bg-rose-950/40 hover:text-rose-400 flex items-center justify-between text-rose-300"
      >
        <span>Terminate instance</span>
      </button>
    </div>
  }
</div>
