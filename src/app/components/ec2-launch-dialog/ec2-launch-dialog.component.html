<div
  class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4"
>
  <div
    class="bg-slate-900 border border-slate-700 rounded-lg w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]"
  >
    <div
      class="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-950"
    >
      <div class="flex items-center gap-2">
        <span
          class="text-xs font-semibold px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800"
          >EC2</span
        >
        <h2 class="text-sm font-semibold text-slate-100">Launch an instance</h2>
      </div>
      <button
        (click)="close.emit()"
        class="text-slate-400 hover:text-slate-200"
      >
        ✕
      </button>
    </div>

    <div class="p-6 overflow-y-auto space-y-6 flex-1 text-xs text-slate-300">
      <div class="space-y-2">
        <label class="block font-medium text-slate-200">Name</label>
        <input
          [(ngModel)]="instanceName"
          type="text"
          placeholder="e.g., Production-API-Server"
          class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500"
        />
      </div>

      <div class="space-y-2">
        <label class="block font-medium text-slate-200">Instance type</label>
        <select
          [(ngModel)]="instanceType"
          class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500"
        >
          <option value="t3.micro">t3.micro (2 vCPU, 1 GiB RAM)</option>
          <option value="t3.small">t3.small (2 vCPU, 2 GiB RAM)</option>
        </select>
      </div>
    </div>

    <div
      class="px-6 py-4 border-t border-slate-800 bg-slate-950 flex items-center justify-end gap-3"
    >
      <button
        (click)="close.emit()"
        class="px-4 py-2 border border-slate-700 hover:bg-slate-800 rounded font-medium text-slate-300"
      >
        Cancel
      </button>
      <button
        (click)="submit()"
        class="px-5 py-2 bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-semibold rounded shadow"
      >
        Launch instance
      </button>
    </div>
  </div>
</div>
