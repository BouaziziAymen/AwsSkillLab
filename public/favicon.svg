<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Define a subtle gradient for the cyan elements -->
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Academic Cap (Mortarboard) forming the top element -->
  <!-- Tassel on the right -->
  <path d="M24 18v6l-8 4-8-4v-6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cap square top -->
  <path d="M16 4L4 10l12 6 12-6-12-6z" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tassel string -->
  <path d="M24 21.5v3" stroke="#facc15" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tassel knot/fringe -->
  <circle cx="24" cy="25" r="1.5" fill="#facc15"/>

  <!-- AWS Cloud Shape (Modified to sit under the cap) -->
  <path d="M10 16.5c-3.3 0-6 2.5-6 5.5s2.7 5.5 6 5.5h12c3.3 0 6-2.5 6-5.5s-2.7-5.5-6-5.5h-.5c-.5-2.5-2.7-4.5-5.5-4.5-2.2 0-4.1 1.3-5 3.2-.5-.2-1.1-.2-1.7-.2z" fill="none" stroke="url(#iconGradient)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small Shield (Training Certification mark) centered on the cloud -->
  <path d="M16 20a2 2 0 012 2v2h-4v-2a2 2 0 012-2z" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
